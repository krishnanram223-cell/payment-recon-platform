[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "payrecon"
version = "0.1.0"
description = "Payment acquiring, processing and reconciliation platform (portfolio project)"
requires-python = ">=3.10"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
markers = [
    "kafka: needs a running Kafka broker (skipped automatically when none is reachable)",
    "slow: streaming and full-pipeline tests (several minutes each)",
]
